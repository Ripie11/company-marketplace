# ============================================================================
# routing-rules.yaml —— 分类规则表（信号 → 属性映射 + 权重 + 护栏）
# ----------------------------------------------------------------------------
# 【为什么外置】分类知识必须能被积累、被人工微调。上一版把 22 条判定写死在
# Python 的 ITEMS 数组里，加一份新文档就要改代码 —— 那是反面教材。
#
# 【信号可靠性排序】① 文件名结构  >  ② 文档内部结构  >  ③ 正文关键词  >  ④ 来源路径
#   同优先级冲突 → 直接降级为「低置信」，转人工，不要猜。
#
# 【字段语义】
#   match        正则，对【信号载体】做匹配（文件名 / 首段 / 正文 / 路径）
#                 ⚠️ 文件名信号一律对 `Path.stem`（不含扩展名）匹配 ——
#                    否则 `规范$` 这类锚定会被结尾的 `.docx` 破坏
#   set          命中后【直接设定】属性（覆盖同优先级，权重更高者胜）
#   add_tags     命中后【追加】标签（不覆盖）
#   weight       0~1，用于同优先级冲突时比较；也参与置信度计算
#   type_priority 仅在 type 类规则中使用，值越大越优先
#
# 【调优纪律】任何规则改动后必须跑：
#   python scripts/backtest.py --truth <_metadata.csv> --input <原始素材目录>
# ============================================================================
version: 2
updated: "2026-09-10"

# ---------------------------------------------------------------------------
# 信号①：文件名标记 —— 集团文件名有强规律，最高信噪比
# ---------------------------------------------------------------------------
filename_markers:
  # —— 对外汇报：报送部委（敏感，固定句式）
  - match: "报(?P<org>住建部|水利部|生态环境部|省厅|省)"
    set: { type: 对外汇报, audience: 部委, security: 敏感 }
    add_tags: ["对外汇报"]
    weight: 0.95
    type_priority: 100
    evidence: "文件名含【报{org}】"

  # —— 专题汇报：呈报市政府（敏感）
  - match: "发市长|呈市长|报市政府|报市府|呈报市政府"
    set: { type: 专题汇报, audience: 市政府, security: 敏感 }
    weight: 0.88
    type_priority: 75
    evidence: "文件名含「发市长」→ 呈报市政府"

  # —— 就职演讲
  - match: "就职演讲"
    set: { type: 就职演讲, audience: 行业协会, security: 公开 }
    weight: 0.95
    type_priority: 90
    evidence: "文件名含「就职演讲」"

  # —— 主旨报告（PPT 形态居多，归入重要会议致辞）
  - match: "主旨报告"
    set: { type: 主旨报告, audience: 行业协会, security: 公开 }
    weight: 0.95
    type_priority: 88
    evidence: "文件名含「主旨报告」"

  # —— 致辞（含"上的致辞""致辞"）
  - match: "致辞"
    set: { type: 致辞, audience: 行业协会, security: 公开 }
    weight: 0.9
    type_priority: 70
    evidence: "文件名含「致辞」"

  # —— 讲话
  - match: "讲话"
    set: { type: 讲话, audience: 行业协会, security: 公开 }
    weight: 0.85
    type_priority: 65
    evidence: "文件名含「讲话」"

  # —— 年度工作总结（多种写法）
  #    ⚠️ 陷阱：不能写裸的 "总结大会" —— 会误吞"半年工作总结大会"。
  #       必须把"年终"作为前提词一起匹配。
  - match: "年终(工作)?总结|年终(工作)?总结大会"
    set: { type: 年终总结, audience: 全员, security: 内部 }
    weight: 0.9
    type_priority: 80
    evidence: "文件名含「年终总结」"

  - match: "(集团|龚董|方总)?\\d{4}\\s*年(度)?(的)?(工作)?总结|工作总结及\\d{4}年度工作计划|\\d{4}年工作总结"
    set: { type: 年终总结, audience: 全员, security: 内部 }
    weight: 0.9
    type_priority: 80
    evidence: "文件名含「{n}年度工作总结」"

  # —— 半年总结
  - match: "半年(工作)?总结|上半年(工作)?总结|下半年工作部署"
    set: { type: 半年总结, audience: 全员, security: 内部 }
    weight: 0.9
    type_priority: 78
    evidence: "文件名含「半年总结」"

  # —— 规范制度
  - match: "(公文|格式|行文).{0,4}规范|规范$|^规范"
    set: { type: 规范, audience: 全员, security: 内部 }
    weight: 0.9
    type_priority: 60
    evidence: "文件名含「规范」"

  # —— 主题标签：鸿蒙
  - match: "鸿蒙"
    add_tags: ["鸿蒙"]
    weight: 0.85
    evidence: "文件名含「鸿蒙」"

  # —— 主题标签：AI / 人工智能
  - match: "人工智能|AI"
    add_tags: ["AI"]
    weight: 0.8
    evidence: "文件名含「人工智能」"

# ---------------------------------------------------------------------------
# 信号②：文档内部结构 —— 称呼语 / 落款
# ---------------------------------------------------------------------------
salutations:
  - match: "^同志们[：:]"
    set: { audience: 全员 }
    weight: 0.7
    evidence: "正文称呼语「同志们：」→ 面向内部全员"

  - match: "^[（(]?[\\u4e00-\\u9fa5]{2,4}(董事长|总裁|总经理|书记)[，,、]"
    set: { audience: 全员 }
    weight: 0.65
    evidence: "正文称呼语含内部职务"

  - match: "^(\\w{2,6}(局长|部长|主任|市长|厅长)|各位领导|各位来宾|尊敬的)"
    set: { audience: 部委 }
    weight: 0.7
    evidence: "正文称呼语面向外部领导"

# ---------------------------------------------------------------------------
# 信号③：正文关键词 → type（仅在文件名信号缺失时兜底）
# ---------------------------------------------------------------------------
keyword_types:
  - match: "就职(演讲|发言)|担任.{0,10}(会长|委员)期间"
    type: 就职演讲
    weight: 0.6
  - match: "上半年工作|下半年工作(部署|安排)|时间过半"
    type: 半年总结
    weight: 0.6
  - match: "(年度|全年)工作(总结|回顾)|下一年度|明年.{0,6}工作(计划|思路)"
    type: 年终总结
    weight: 0.6
  - match: "专(题|项)报告|现将.{0,12}(情况|工作)报告如下"
    type: 专题汇报
    weight: 0.55
  - match: "报(送|请).{0,6}(部|厅|局)|恳请.{0,8}(支持|指导)"
    type: 对外汇报
    weight: 0.55

# ---------------------------------------------------------------------------
# 信号④：来源路径 —— 弱信号，但稳定
#   权重说明：本项目是【受控入库】而非爬虫抓取 —— 原始文件夹由人工维护，
#   用户把文件放进「龚利民-董事长/」本身就是一次人工判定，故给 0.72
#   （仍低于文件名 0.9 与落款 0.75 以下的信任度）。
# ---------------------------------------------------------------------------
source_dirs:
  - path_contains: "龚利民"
    set: { leader: 龚利民 }
    weight: 0.72
  - path_contains: "方琳"
    set: { leader: 方琳 }
    weight: 0.72

# 文件名中的领导指代（比路径更可靠，故单列）
subject_markers:
  - match: "[（(]龚董[）)]|龚利民|龚董|龚总"
    set: { leader: 龚利民 }
    weight: 0.9
    evidence: "文件名/落款指代龚利民"
  - match: "[（(]方(琳)?总[）)]|方琳|方总"
    set: { leader: 方琳 }
    weight: 0.9
    evidence: "文件名/落款指代方琳"

# ---------------------------------------------------------------------------
# 日期抽取规则
#   stage: explicit —— 对【文件名】匹配，命中即返回（信噪比最高）
#   stage: content  —— 对【正文】匹配，仅在文件名完全无年份线索时启用
#   两者都未命中 → 走"类型感知的年份兜底"（见 classify.extract_date）
# ---------------------------------------------------------------------------
date_rules:
  - name: 【完整日期】
    stage: explicit
    match: "【(20\\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])】"
    format: "{1}-{2}-{3}"
  - name: 【年月】
    stage: explicit
    match: "【(20\\d{2})(0[1-9]|1[0-2])】"
    format: "{1}-{2}-01"
  # ⚠️ 顺序陷阱：8 位内嵌日期必须排在 4 位【年份】之前。
  #    否则【鸿蒙生态大会】【2026】20260828… 会被【2026】截胡，丢掉 0828 这个真日期。
  - name: 文件名内嵌完整日期
    stage: explicit
    match: "(?<![\\d【])(20\\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])(?![\\d】])"
    format: "{1}-{2}-{3}"
  - name: 【年份】
    stage: explicit
    match: "【(20\\d{2})\\s*年?[^\\d]"
    format: "{1}-01-01"
  - name: 正文中文日期
    stage: content
    match: "二[〇○零一二三四五六七八九十]{1,3}年[一二三四五六七八九十]{1,3}月"
    format: cn
  - name: 正文阿拉伯日期
    stage: content
    match: "(20\\d{2})年(\\d{1,2})月"
    format: "{1}-{2}-01"

# 日期策略：某些类型不参与"正文日期"抽取
#   制度/规范类文件没有"发布时间"语义，正文里出现的年份往往是【举例】
#   （如"比如 2026 年 3 月，不要用于 2026 年 3 月"），会严重污染日期推断。
date_policy:
  skip_content_types: ["规范"]

# 类型感知的年份兜底月日：文件名里只有"某年"、无具体月日时使用
#   年终总结：年度总结在【次年】一季度发布 → year+1 年 1 月 1 日
#   半年总结：当年 7 月发布 → year 年 7 月 1 日
#   其他    ：year 年 1 月 1 日
date_year_defaults:
  年终总结: { year_offset: 1, month: 1, day: 1 }
  半年总结: { year_offset: 0, month: 7, day: 1 }
  default: { year_offset: 0, month: 1, day: 1 }
fallback_date: "2024-01-01"

# ---------------------------------------------------------------------------
# 路由映射：type + leader → target_dir
#   target_dir = SPACE_OF(leader) + "/" + SUB_OF(type)
# ---------------------------------------------------------------------------
routing:
  # 子目录归属由 taxonomy.yaml 的 sub_dirs[].types 推导，此处只处理特例
  overrides:
    # 规范制度【无领导】—— 直接落 00 空间根，且 subject 置为 "-"
    - when: { type: 规范 }
      target_dir: "00-规范制度"
    # 主旨报告与致辞/讲话同属"重要会议致辞"目录
    - when: { type: 主旨报告 }
      sub_dir: "重要会议致辞"

# ---------------------------------------------------------------------------
# 置信度计算与分流
#   置信度 = Σ(期望字段权重 × 该字段命中权重) / Σ(期望字段权重)
#   「期望字段」= type 必定期望；leader 视空间是否有主体而定；audience/security 命中即期望。
#   这样归一化后，一份"字段少但都命中"的文档不会被无端压低分数。
# ---------------------------------------------------------------------------
confidence:
  weights:
    type: 0.45          # type 命中（最重要的字段）
    leader: 0.30        # leader 命中
    audience: 0.10
    security: 0.10
  thresholds:
    high: 0.80          # >= 高：静默归类
    medium: 0.55        # >= 中：预演确认
    # < medium：低：拦截提问
  penalties:
    signal_conflict: 0.30          # 同优先级信号冲突
    unknown_type: 0.40             # type 无候选（新类型）
    unknown_leader: 0.50           # leader 未知（可能出现第 3 位领导）
    source_content_mismatch: 0.15  # 来源路径与内容判断不一致
    unparsed_legacy_doc: 0.05      # 旧版 .doc 只能关键词兜底

# ---------------------------------------------------------------------------
# 护栏：不可协商，任何自动化都不得绕过
# ---------------------------------------------------------------------------
guardrails:
  # 密级隔离采用【不一致才拦】而非【敏感就拦】：
  #   对外汇报（部委）/ 专题汇报 本身就是"敏感类目录"，敏感文件落进去是【正确】的；
  #   只有当 密级 与 目标目录性质【不一致】时才拦截。
  sensitive_requires_confirm: true    # 敏感文件落进非敏感目录 → 必须确认
  public_into_restricted_blocks: true # 公开文件落进敏感目录 → 必须确认
  unknown_leader_blocks: true         # leader 未知 → 禁止自动编号，必须人工定主空间
  unknown_type_blocks: true           # type 无候选 → 不自动建目录，改为提问
  never_auto_create_space: true       # 永不自动创建主空间（编号=显示顺序，属结构性变更）
  never_auto_create_subdir: true      # 永不自动创建子目录（先尝试映射到已有类型）
  conflict_no_autorename: true        # 同名冲突 → 报冲突，禁止自动加 _v2
  dry_run_default: true               # 接入新目录默认先出计划不执行

# ---------------------------------------------------------------------------
# 授权域（P2 乐享同步用）
#   【核心论证】用户提供根 space_id 的那一刻，即已把"该空间内的目录路由"委托
#   给数字员工。域内归类属【委托决策】，不是官方安全规则所禁止的"自行选择目标"。
#   域外（新主空间 / 新知识库）一律走确认流程。
# ---------------------------------------------------------------------------
authorized_domain:
  # 留空 = 尚未授权，任何写入都必须先向用户索取根 space_id
  space_id: ""
  root_entry_id: ""
  authorized_at: ""
  scope: "域内子目录自主路由；域外一律确认"
