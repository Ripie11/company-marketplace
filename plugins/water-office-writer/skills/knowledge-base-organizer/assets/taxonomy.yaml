# ============================================================================
# taxonomy.yaml —— 知识库骨架与枚举的【单一数据源】
# ----------------------------------------------------------------------------
# 本文件同时驱动四件事，改一处即四处生效：
#   ① 目录结构生成      ② README 索引排序
#   ③ 元数据字段校验    ④ classify.py 的路由解析
#
# 【修改纪律】
#   - 新增主空间 = 结构性变更，必须人工确认（见 routing-rules.yaml: guardrails）
#   - 新增子目录前先问自己：能不能用【标签】表达？主题类一律用标签，不建目录
#   - 顺序即知识库显示顺序，按组织层级/业务阅读顺序排，不要用字母序
# ============================================================================
version: 1
updated: "2026-09-10"

meta:
  name: "深圳水务集团 · 领导讲话知识库"
  # 文件命名模板：{date}_{type}_{title}_{subject}{ext}
  naming_pattern: "{date}_{type}_{title}_{subject}{ext}"
  date_format: "YYYYMMDD"
  subject_placeholder: "无领导"        # subject 为 "-"（无特定领导）时的占位
  forbidden_chars: ["/", "\\", ":", "：", "*", "?", "\"", "<", ">", "|", "\n"]

  # 命名噪音：生成新文件名时必须剥离的版本词/序号/附件词
  strip_patterns:
    - "终稿|定稿|最终版|成稿|修订稿"
    - "第[一二三四五六七八九十\\d]+次审稿后?"
    - "附件\\d+"
    - "已更新全年数据|会后完善|会后完善定稿"
    - "\\(\\d+\\)|（\\d+）"           # 尾部 (1)(2) 重复编号
    - "\\d{4}\\s*\\d{3,4}"           # 形如 0711 1300 的时间戳
    - "发市长\\d+|发市长"

  # 标题兜底：当文件名压缩后的标题"退化为类型词本身"且无【】语境可借时使用。
  # 这些是人工已确认的规范标题，属可积累资产；引擎只读取，不硬编码。
  title_fallback:
    规范: "公文格式规范"

# ---------------------------------------------------------------------------
# 主空间（第一层）：按【组织层级】排序，职级高者在前
# ---------------------------------------------------------------------------
spaces:
  - id: "00-规范制度"
    order: 0
    subjects: ["-"]
    description: "集团内部公文/报告写作规范与制度文件"
    default_security: "内部"

  - id: "01-龚利民（董事长）"
    order: 1
    subjects: ["龚利民"]
    aliases: ["01-龚利民", "龚利民-董事长", "龚利民"]
    description: "董事长龚利民的总结讲话、致辞、对外汇报与专题报告"
    default_security: "内部"

  - id: "02-方琳（总裁）"
    order: 2
    subjects: ["方琳"]
    aliases: ["02-方琳（执行总裁）", "02-方琳", "方琳-总裁", "方琳"]
    description: "总裁方琳的工作报告与讲话"
    default_security: "内部"

# ---------------------------------------------------------------------------
# 子目录（第二层）：按【业务阅读顺序】而非字母序
#   顺序建议：总结类 → 对外类 → 专题类 → 场合类
# ---------------------------------------------------------------------------
sub_dirs:
  - id: "集团年度工作总结"
    order: 0
    types: ["年终总结"]
    audiences: ["全员"]
    security: "内部"
    description: "面向集团全员的年度工作总结（含年度工作计划）"

  - id: "集团半年工作总结"
    order: 1
    types: ["半年总结"]
    audiences: ["全员"]
    security: "内部"
    description: "半年工作总结及下半年工作部署"

  - id: "重要会议致辞"
    order: 2
    types: ["致辞", "讲话", "主旨报告"]
    audiences: ["行业协会", "公众"]
    security: "公开"
    description: "论坛/协会/博览会等公开场合的致辞与讲话（可公开）"

  - id: "对外汇报（部委）"
    order: 3
    types: ["对外汇报"]
    audiences: ["部委"]
    security: "敏感"
    description: "报送部委的工作汇报（敏感，独立目录便于设权限）"

  - id: "专题汇报"
    order: 4
    types: ["专题汇报"]
    audiences: ["市政府", "部委"]
    security: "敏感"
    description: "就某一专题向上级/政府的专项报告（敏感）"

  - id: "就职演讲"
    order: 5
    types: ["就职演讲"]
    audiences: ["行业协会"]
    security: "公开"
    description: "就任社会职务时的演讲"

# ---------------------------------------------------------------------------
# 枚举：元数据字段的合法取值（校验与抽取都以此为准）
# ---------------------------------------------------------------------------
enums:
  type:
    - 年终总结
    - 半年总结
    - 致辞
    - 讲话
    - 主旨报告
    - 对外汇报
    - 专题汇报
    - 就职演讲
    - 规范
  audience:
    - 全员
    - 行业协会
    - 部委
    - 市政府
    - 省厅
    - 公众
  security:
    - 公开
    - 内部
    - 敏感
    - 机密
  subject:
    - 龚利民
    - 方琳
    - "-"

# 主题类标签的词表——刻意【不建目录】，只用标签表达
# 新增主题只需在此登记，不产生任何目录
tag_vocabulary:
  主题: ["鸿蒙", "AI", "人工智能", "智慧水务", "国际化", "出海", "新质生产力", "十五五"]
  品牌: ["千家万户水管家", "深水云脑", "深小水AI智能体", "水鸿生态"]
  机构: ["住建部", "水利部", "生态环境部", "中国水协", "供排水协会", "粤港澳大湾区", "GIIC"]

# ---------------------------------------------------------------------------
# 密级与目录的绑定关系（护栏用：禁止密级错放）
# ---------------------------------------------------------------------------
security_policy:
  # 判为这些密级的文件，禁止落入"公开"性质的目录
  restricted_levels: ["敏感", "机密"]
  public_dirs: ["重要会议致辞", "就职演讲"]
  rule: "restricted_levels 的文件不得写入 public_dirs，反之亦然——公开与会敏感必须分目录隔离"
